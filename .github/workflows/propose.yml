name: Propositions du jour
on:
  schedule:
    # Plusieurs tentatives : GitHub a parfois du retard. Le programme n'envoie qu'une fois par jour, à partir de 8 h (heure de Paris).
    - cron: "7 6 * * *"
    - cron: "37 6 * * *"
    - cron: "7 7 * * *"
    - cron: "37 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: popcorn
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py daily
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sauvegarde de l'historique
        if: always()
        run: |
          git config user.name "popcorn-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "maj" && git pull --rebase && git push)
